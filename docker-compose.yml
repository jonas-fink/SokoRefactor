services:
    mongo:
        image: mongo:8
        restart: unless-stopped
        # Kein `ports`: die Datenbank laeuft ohne Authentifizierung, ein
        # veroeffentlichter Port waere damit ein offener Lesezugriff auf
        # Beratungsdaten, Favoriten und Chat-Verlaeufe fuer jeden im Netz.
        # Backend und (spaeter) Metabase erreichen sie ueber das Compose-Netz
        # per Servicename; fuer Adminzugriff `docker compose exec mongo mongosh`.
        volumes:
            - mongo-data:/data/db

    backend:
        build: ./soko-backend
        restart: unless-stopped
        env_file: .env
        depends_on: [mongo]

    client:
        build:
            context: ./soko-client
            args:
                VITE_PUBLIC_MAPBOX_TOKEN: ${VITE_PUBLIC_MAPBOX_TOKEN}
                VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-}
                VITE_UMAMI_ID: ${VITE_UMAMI_ID:-}
        restart: unless-stopped
        ports:
            - '127.0.0.1:8080:80'
        depends_on: [backend]

    # Auswertung der Kennzahlen aus `models/metric.ts`, der Feedbacks und der
    # Favoriten — per Klick, statt ein `/admin`-UI zu bauen (ARCHITEKTUR § 2.6).
    # Verbindet sich im Compose-Netz direkt mit `mongo:27017`, deshalb braucht
    # Mongo weiterhin keinen veroeffentlichten Port.
    # Loopback: erreichbar nur ueber Tailscale, das soll niemand von aussen sehen.
    metabase:
        image: metabase/metabase:latest
        restart: unless-stopped
        ports:
            - '127.0.0.1:3001:3000'
        environment:
            # Sonst legt Metabase seine H2-Datei ins Image und verliert beim
            # naechsten `pull` alle Fragen und Dashboards.
            MB_DB_FILE: /metabase-data/metabase.db
        volumes:
            - metabase-data:/metabase-data
        depends_on: [mongo]

    # Reichweitenzahlen. Cookielos, IP gehasht, hier selbst gehostet → nach
    # TDDDG § 25 ohne Consent-Banner zulaessig, solange nichts auf dem Geraet
    # gespeichert wird. Deshalb **keine** Umami-Cloud und kein Session-Cookie.
    #
    # Anders als Metabase muss das oeffentlich erreichbar sein — den Tracker
    # laedt der Browser des Besuchers. Der Port bleibt trotzdem auf Loopback:
    # nach aussen bringt ihn der Reverse Proxy, der auch TLS terminiert, genau
    # wie beim Client.
    umami:
        image: ghcr.io/umami-software/umami:postgresql-latest
        restart: unless-stopped
        ports:
            - '127.0.0.1:3002:3000'
        environment:
            # `UMAMI_DB_PASSWORD` muss URL-sicher sein — `openssl rand -hex 24`,
            # **nicht** `-base64`: ein `/` im Passwort zerlegt diese URL, und
            # Umami stirbt mit `ERR_INVALID_URL`, bevor es die DB je sieht.
            DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
            APP_SECRET: ${UMAMI_APP_SECRET}
        depends_on: [umami-db]

    # Eigene Datenbank, nicht Mongo: Umami spricht Postgres, und die
    # Reichweitenzahlen haben in der App-Datenbank nichts verloren.
    umami-db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: umami
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
        volumes:
            - umami-db-data:/var/lib/postgresql/data

volumes:
    mongo-data:
    metabase-data:
    umami-db-data:
