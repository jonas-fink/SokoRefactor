services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./soko-backend
    restart: unless-stopped
    env_file: .env
    depends_on: [mongo]

  client:
    build:
      context: ./soko-client
      args:
        VITE_PUBLIC_MAPBOX_TOKEN: ${VITE_PUBLIC_MAPBOX_TOKEN}
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on: [backend]

volumes:
  mongo-data:
