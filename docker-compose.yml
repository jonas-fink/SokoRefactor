services:
    mongo:
        image: mongo:8
        restart: unless-stopped
        # Kein `ports`: die Datenbank laeuft ohne Authentifizierung, ein
        # veroeffentlichter Port waere damit ein offener Lesezugriff auf
        # Beratungsdaten, Favoriten und Chat-Verlaeufe fuer jeden im Netz.
        # Backend und (spaeter) Metabase erreichen sie ueber das Compose-Netz
        # per Servicename; fuer Adminzugriff `docker compose exec mongo mongosh`.
        volumes:
            - mongo-data:/data/db

    backend:
        build: ./soko-backend
        restart: unless-stopped
        env_file: .env
        depends_on: [mongo]

    client:
        build:
            context: ./soko-client
            args:
                VITE_PUBLIC_MAPBOX_TOKEN: ${VITE_PUBLIC_MAPBOX_TOKEN}
        restart: unless-stopped
        ports:
            - '127.0.0.1:8080:80'
        depends_on: [backend]

volumes:
    mongo-data:
